name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Pruebas y estilo

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Dependencias PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Dependencias JS
        run: npm ci

      - name: Compilar frontend
        run: npm run build

      - name: Estilo (Pint)
        run: vendor/bin/pint --test

      - name: Pruebas
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
